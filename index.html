<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pindrop</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/img/icon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header>
  <h1>Pindrop</h1>
  <span class="subtitle">국내 사진은 대한민국 지도에, 해외 사진은 따로 정리하세요</span>
  <div class="health-dots" id="health-dots" title="서버 상태">
    <span class="health-dot" id="dot-flask" title="Flask 서버">F</span>
    <span class="health-dot" id="dot-ollama" title="Ollama AI">AI</span>
  </div>
  <span class="pin-count" id="pin-count"></span>
  <div class="header-actions">
    <button class="toolbar-btn" id="fit-btn" title="전체 핀 보기">⊙ 전체 보기</button>
    <button class="toolbar-btn" id="arc-btn" title="여행 경로 보기">〜 경로 보기</button>
    <button class="toolbar-btn" id="map-mode-btn" title="Global detail map">&#49345;&#49464; &#51648;&#46020;</button>
    <button class="toolbar-btn tour" id="tour-btn" title="저장된 사진 순서로 여행 재생">▶ 여행 재생</button>
    <button class="toolbar-btn export" id="export-btn" title="JSON으로 내보내기">↓ 내보내기</button>
  </div>
</header>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-section">
      <h2>사진 업로드</h2>
      <label class="upload-zone" id="upload-zone">
        <input type="file" id="file-input" accept="image/*" multiple>
        <div class="icon">📍</div>
        <p>
          <strong>클릭</strong>하거나 사진을 끌어다 놓으세요<br>
          <small>GPS 정보가 포함된 사진이어야 합니다<br>JPG · PNG · HEIC · WEBP · 최대 30MB</small>
        </p>
      </label>
    </div>

    <div class="sidebar-section ai-status-section" id="ai-status-section">
      <h2>AI 상태</h2>
      <div class="ai-status" id="ai-status">
        <div class="ai-status-row">
          <span class="ai-status-label">Ollama</span>
          <span class="ai-status-value" id="ai-status-ollama">확인 중…</span>
        </div>
        <div class="ai-status-row">
          <span class="ai-status-label">사진 태그·캡션</span>
          <span class="ai-status-value" id="ai-status-vision">확인 중…</span>
        </div>
        <div class="ai-status-row">
          <span class="ai-status-label">검색 재정렬</span>
          <span class="ai-status-value" id="ai-status-rerank">확인 중…</span>
        </div>
        <div class="ai-status-hint" id="ai-status-hint"></div>
      </div>
    </div>

    <!-- 통계 -->
    <div class="sidebar-section" id="stats-section" style="display:none">
      <h2>여행 통계</h2>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value" id="stat-pins">0</div>
          <div class="stat-label">핀</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-places">0</div>
          <div class="stat-label">지역</div>
        </div>
      </div>
      <div class="stat-tags" id="stat-tags"></div>
    </div>

    <!-- 자연어 검색 -->
    <div class="sidebar-section search-section">
      <h2>사진 검색</h2>
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="예: 저녁에 먹은 라멘, 해질녘 바다"
          autocomplete="off"
        >
        <button class="search-btn" id="search-btn">검색</button>
        <button class="search-clear" id="search-clear" style="display:none" title="검색 초기화">✕</button>
      </div>
      <div class="search-label" id="search-label" style="display:none"></div>
    </div>

    <!-- 범위 필터 -->
    <div class="sidebar-section" id="scope-section">
      <h2>보기 범위</h2>
      <div class="filter-bar" id="scope-filter">
        <button class="filter-chip active" data-scope="all">전체</button>
        <button class="filter-chip" data-scope="domestic">국내</button>
        <button class="filter-chip" data-scope="international">해외</button>
      </div>
    </div>

    <!-- 태그 필터 -->
    <div class="sidebar-section" id="filter-section" style="display:none">
      <h2>태그 필터</h2>
      <div class="filter-bar" id="filter-bar"></div>
    </div>

    <!-- 날짜 필터 -->
    <div class="sidebar-section" id="date-filter-section" style="display:none">
      <h2>날짜 필터</h2>
      <div class="date-filter-bar">
        <input type="number" id="date-from" class="date-input" placeholder="시작 연도" min="2000" max="2030">
        <span class="date-sep">—</span>
        <input type="number" id="date-to" class="date-input" placeholder="종료 연도" min="2000" max="2030">
        <button class="search-clear" id="date-clear" title="날짜 필터 초기화">✕</button>
      </div>
    </div>

    <!-- 핀 목록 -->
    <div class="sidebar-section list-section">
      <h2>핀 목록</h2>
      <div class="pin-groups">
        <div class="pin-group" id="domestic-section">
          <div class="pin-group-header">
            <span>국내 지도</span>
          </div>
          <div class="pin-list" id="pin-list">
            <div class="empty-state" id="empty-state">
              국내 사진이 여기에 표시됩니다.<br>
              GPS가 포함된 여행 사진을 올려보세요.
            </div>
          </div>
        </div>

        <div class="pin-group overseas-pin-group" id="overseas-section">
          <div class="pin-group-header">
            <span>해외 사진</span>
            <span class="pin-group-count" id="overseas-count">0</span>
          </div>
          <div class="pin-list" id="overseas-list">
            <div class="empty-state" id="overseas-empty-state">
              해외 사진이 여기에 따로 표시됩니다.
            </div>
          </div>
        </div>
      </div>
    </div>

  </aside>

  <!-- Map -->
  <div class="globe-container">
    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="사이드바 열기/닫기">☰</button>
    <div id="globe"></div>

    <!-- 투어 진행 오버레이 -->
    <div class="tour-overlay" id="tour-overlay" style="display:none">
      <div class="tour-card">
        <div class="tour-plane-icon">▶</div>
        <div class="tour-place" id="tour-place">이동 중…</div>
        <div class="tour-progress-text" id="tour-progress"></div>
        <div class="tour-bar-wrap">
          <div class="tour-bar" id="tour-bar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Popup -->
    <div class="popup" id="popup">
      <div class="popup-actions">
        <button class="popup-delete" id="popup-delete" title="핀 삭제">🗑</button>
        <button class="popup-close"  id="popup-close"  title="닫기">✕</button>
      </div>
      <img class="popup-img" src="" alt="사진 미리보기" title="클릭하면 크게 볼 수 있습니다">
      <div class="place-name"></div>
      <div class="coords"></div>
      <div class="popup-date"></div>
      <div class="transport-field" id="transport-field" style="display:none">
        <label for="transport-mode">이동수단</label>
        <select id="transport-mode"></select>
      </div>
      <div class="transport-summary" id="transport-summary" style="display:none"></div>
      <div class="popup-tags"></div>
      <div class="popup-caption" id="popup-caption"></div>
    </div>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<!-- Toast -->
<div class="toast-container" id="toast-container"></div>

<!-- CDN -->
<script src="https://unpkg.com/globe.gl"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

<!-- App -->
<script src="/static/js/exif.js"></script>
<script src="/static/js/scope.js"></script>
<script src="/static/js/globe.js"></script>
<script src="/static/js/main.js"></script>

<script>
  document.getElementById('sidebar-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
</script>

</body>
</html>
